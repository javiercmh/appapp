name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PAPPAPP_DEV_VERSION_CODE=3 :app:testDebugUnitTest :app:compileReleaseKotlin :app:assembleDev :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin
      - name: Verify shared compatibility and independent Dev APK counter
        run: |
          python3 - <<'PYTHON'
          import json
          import pathlib
          import re
          root = pathlib.Path('app/build/generated/source/buildConfig')
          for variant in ('debug', 'dev', 'release'):
              source = (root / variant / 'com/wynh/appapp/BuildConfig.java').read_text()
              assert re.search(r'HOST_COMPATIBILITY_LEVEL\s*=\s*11;', source), variant
          metadata = json.loads(pathlib.Path('app/build/outputs/apk/dev/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.wynh.appapp.dev'
          assert all(item['versionCode'] == 3 for item in metadata['elements'])
          print('All variants support compatibility 11; Dev APK counter remains 3.')
          PYTHON
      - run: node --test tests/*.test.mjs scripts/tests/*.mjs
      - run: python3 -B -m unittest discover -s tests -p 'test_demo_dev_server.py'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/build/test-results/
