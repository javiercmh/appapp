name: Publish App² Dev
run-name: App² Dev build ${{ github.run_number }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app2-dev-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check project
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDev :app:compileDebugAndroidTestKotlin
          node --test tests/*.test.mjs scripts/tests/*.mjs
          python3 -B -m unittest discover -s tests -p 'test_demo_dev_server.py'
      - name: Load persistent Dev signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APPAPP_DEV_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Set APPAPP_DEV_KEYSTORE_BASE64; see docs/DEV_DISTRIBUTION.md'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app2-dev.p12"
      - name: Build signed Dev APK
        env:
          ORG_GRADLE_PROJECT_APPAPP_DEV_STORE_FILE: ${{ runner.temp }}/app2-dev.p12
          ORG_GRADLE_PROJECT_APPAPP_DEV_STORE_PASSWORD: ${{ secrets.APPAPP_DEV_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_APPAPP_DEV_KEY_ALIAS: ${{ secrets.APPAPP_DEV_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_APPAPP_DEV_KEY_PASSWORD: ${{ secrets.APPAPP_DEV_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APPAPP_DEV_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleSignedDev
      - name: Verify and prepare download
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/dev/app-dev.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/dev/app-dev.apk
          mkdir -p dist
          cp app/build/outputs/apk/dev/app-dev.apk dist/app2-dev.apk
          cd dist
          sha256sum app2-dev.apk > app2-dev.apk.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dev-notes.md" <<NOTES
          App² Dev build ${BUILD_NUMBER}, from commit ${SOURCE_SHA}.

          Download app2-dev.apk to your Android phone and open it to install.
          App² Dev installs separately from App², with its own apps, settings and AI connections.
          Future Dev builds update this installation using the same dedicated Dev signing key.
          Development preview; emulator checks are separate from this workflow's build and static checks.
          NOTES
          gh release create "dev-${BUILD_NUMBER}" dist/app2-dev.apk dist/app2-dev.apk.sha256 \
            --target "$SOURCE_SHA" --title "App² Dev — build ${BUILD_NUMBER}" \
            --prerelease --latest=false --notes-file "$RUNNER_TEMP/dev-notes.md"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/app2-dev.p12"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
